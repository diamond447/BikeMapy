{% extends "admin/base_site.html" %}
{% block content %}
<h1>Category {{ workflow }}</h1>
{% if workflow == "delete" %}<p>Delete {{ object }}?</p>{% endif %}
<form method="post">
  {% csrf_token %}
  {% if workflow != "delete" %}
  <p><label>Name</label><br><input name="name" required value="{{ object.name|default:'' }}"></p>
  <p><label>Slug</label><br><input name="slug" required value="{{ object.slug|default:'' }}"></p>
  <p><label>Description</label><br><textarea name="description">{{ object.description|default:'' }}</textarea></p>
  {% endif %}
  <p><label>Reason</label><br><textarea name="reason" required></textarea></p>
  <button type="submit">Confirm</button>
</form>
{% endblock %}
