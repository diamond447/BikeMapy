default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.5
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
  - repo: local
    hooks:
      - id: frontend-prettier
        name: frontend prettier
        entry: sh -c 'cd frontend && corepack pnpm format'
        language: system
        files: ^frontend/.*\.(css|html|js|json|ts|tsx|yaml)$
        # pnpm-lock.yaml is generated by pnpm and is intentionally excluded
        # from the package's Prettier check via frontend/.prettierignore.
        exclude: ^frontend/pnpm-lock\.yaml$
        pass_filenames: false
  - repo: local
    hooks:
      - id: conventional-commit
        name: conventional commit message
        entry: python scripts/check_commit_message.py
        language: system
        stages: [commit-msg]
        always_run: true
        pass_filenames: true
