name: bikemapy

services:
  backend:
    image: ${BIKEMAPY_BACKEND_IMAGE:?Select an immutable sha image before starting}
    restart: unless-stopped
    # Not PID 1, so a crash of the service ends the container and it restarts.
    init: true
    env_file: ${BIKEMAPY_ENV_FILE:-.env.production}
    environment:
      BIKEMAPY_DEPLOYMENT_MODE: production
      DJANGO_DEBUG: ${DJANGO_DEBUG:?Set DJANGO_DEBUG=false in the production environment}
    # Refuse to start against an unmigrated schema.
    command:
      - /bin/sh
      - -c
      - >-
        echo 'migration preflight: checking applied schema' >&2 &&
        python backend/manage.py migrate --check --noinput &&
        exec gunicorn config.wsgi:application
        --logger-class config.gunicorn.JsonGunicornLogger --bind 0.0.0.0:8000
        --workers ${WEB_WORKERS:-3} --error-logfile -
    volumes:
      - gpx_data:/app/storage
    # No fixed address: `run --rm` starts more containers from this service.
    networks:
      default: {}
      proxy: {}
    depends_on:
      db:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
        restart: true
    healthcheck:
      # Needs `backend` in DJANGO_ALLOWED_HOSTS; the header skips the HTTPS redirect.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://backend:8000/health/ready/', headers={'X-Forwarded-Proto': 'https'}), timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: &default-log-rotation
      driver: json-file
      options:
        max-size: "10m"
        max-file: "14"

  worker:
    image: ${BIKEMAPY_BACKEND_IMAGE:?Select an immutable sha image before starting}
    restart: unless-stopped
    init: true
    env_file: ${BIKEMAPY_ENV_FILE:-.env.production}
    environment:
      BIKEMAPY_DEPLOYMENT_MODE: production
      DJANGO_DEBUG: ${DJANGO_DEBUG:?Set DJANGO_DEBUG=false in the production environment}
    command:
      - /bin/sh
      - -c
      - >-
        echo 'migration preflight: checking applied schema' >&2 &&
        python backend/manage.py migrate --check --noinput &&
        exec celery -A config worker --loglevel=INFO
        --concurrency ${CELERY_WORKER_CONCURRENCY:-2}
    volumes:
      - gpx_data:/app/storage
    depends_on:
      db:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
        restart: true
    logging: *default-log-rotation

  beat:
    image: ${BIKEMAPY_BACKEND_IMAGE:?Select an immutable sha image before starting}
    restart: unless-stopped
    init: true
    env_file: ${BIKEMAPY_ENV_FILE:-.env.production}
    environment:
      BIKEMAPY_DEPLOYMENT_MODE: production
      DJANGO_DEBUG: ${DJANGO_DEBUG:?Set DJANGO_DEBUG=false in the production environment}
    command:
      - /bin/sh
      - -c
      - >-
        echo 'migration preflight: checking applied schema' >&2 &&
        python backend/manage.py migrate --check --noinput &&
        exec celery -A config beat --loglevel=INFO
    depends_on:
      db:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
        restart: true
    logging: *default-log-rotation

  db:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in the runtime environment}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the runtime environment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the runtime environment}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../backup:/backup
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    logging: *default-log-rotation

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    logging: *default-log-rotation

  proxy:
    image: nginx:1.29-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/usr/local/bin/nginx-json-entrypoint.sh"]
    command: ["nginx", "-g", "daemon off;"]
    ports:
      # PROXY_BIND: a LAN address when the tunnel runs on another host; firewall it.
      - "${PROXY_BIND:-127.0.0.1}:${PROXY_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./proxy_params:/etc/nginx/proxy_params:ro
      - ./nginx-json-entrypoint.sh:/usr/local/bin/nginx-json-entrypoint.sh:ro
      - gpx_data:/app/storage:ro
    networks:
      proxy:
        ipv4_address: 172.30.0.2
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    logging: *default-log-rotation

volumes:
  gpx_data:
  postgres_data:
  redis_data:

networks:
  proxy:
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1
          # Dynamic addresses (backend, one-off `run` containers) come from the upper
          # half, so the proxy's fixed 172.30.0.2 is always free.
          ip_range: 172.30.0.128/25
