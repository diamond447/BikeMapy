events {}

http {
    # Raw activity imports are bounded by this transport policy and the
    # The backend caps file bytes at 90 MiB. Five MiB remains for bounded
    # multipart framing while the whole request stays under Cloudflare's
    # standard 100 MB request-body ceiling.
    client_max_body_size 95m;
    client_body_timeout 60s;

    log_format json escape=json
        '{"time":"$time_iso8601","status":$status,"method":"$request_method",'
        '"uri":"$uri","request_time":$request_time,"remote":"-"}';
    access_log /dev/stdout json;
    error_log /dev/stderr warn;

    server {
        # Cloudflare Tunnel terminates TLS at the edge and connects to this
        # listener over HTTP. Keeping this explicitly HTTP avoids redirect
        # loops; X-Forwarded-Proto preserves the public HTTPS scheme in Django.
        listen 80;
        server_name _;

        location = /health/live/ { proxy_pass http://backend:8000; include /etc/nginx/proxy_params; }
        location = /health/ready/ { proxy_pass http://backend:8000; include /etc/nginx/proxy_params; }
        location = /health/crawler/ { proxy_pass http://backend:8000; include /etc/nginx/proxy_params; }
        location /api/ { proxy_pass http://backend:8000; include /etc/nginx/proxy_params; }
        location /accounts/ { proxy_pass http://backend:8000; include /etc/nginx/proxy_params; }
        location /admin/ { proxy_pass http://backend:8000; include /etc/nginx/proxy_params; }
        location /static/ { proxy_pass http://backend:8000; include /etc/nginx/proxy_params; }

        # Django returns X-Accel-Redirect only after checking publication,
        # legal approval, and storage existence. This internal location cannot
        # be requested by a browser directly.
        location /_protected_gpx/ {
            internal;
            alias /app/storage/media/;
            add_header X-Content-Type-Options nosniff always;
        }

        location / { return 404; }
    }
}
