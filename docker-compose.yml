services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bikemapy}
      POSTGRES_USER: ${POSTGRES_USER:-bikemapy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bikemapy-local-only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgis/init.sql:/docker-entrypoint-initdb.d/10-postgis.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_CACHE_URL: ${DJANGO_CACHE_URL:-redis://redis:6379/1}
      REPORT_TURNSTILE_SECRET_KEY: ${REPORT_TURNSTILE_SECRET_KEY:-}
      REPORT_RATE_LIMIT_HMAC_SECRET: ${REPORT_RATE_LIMIT_HMAC_SECRET:-}
      REPORT_CLIENT_IP_MODE: ${REPORT_CLIENT_IP_MODE:-direct}
      REPORT_TRUSTED_PROXY_CIDRS: ${REPORT_TRUSTED_PROXY_CIDRS:-}
    command: uv run --locked --no-dev python backend/manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app/backend
      - gpx_data:/app/storage
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "uv", "run", "--locked", "--no-dev", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live/', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_CACHE_URL: ${DJANGO_CACHE_URL:-redis://redis:6379/1}
      REPORT_TURNSTILE_SECRET_KEY: ${REPORT_TURNSTILE_SECRET_KEY:-}
      REPORT_RATE_LIMIT_HMAC_SECRET: ${REPORT_RATE_LIMIT_HMAC_SECRET:-}
      REPORT_CLIENT_IP_MODE: ${REPORT_CLIENT_IP_MODE:-direct}
      REPORT_TRUSTED_PROXY_CIDRS: ${REPORT_TRUSTED_PROXY_CIDRS:-}
    command: uv run --locked --no-dev celery -A config worker --loglevel=INFO
    volumes:
      - ./backend:/app/backend
      - gpx_data:/app/storage
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  beat:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    env_file:
      - path: .env
        required: false
    command: uv run --locked --no-dev celery -A config beat --loglevel=INFO
    volumes:
      - ./backend:/app/backend
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
      VITE_PUBLIC_SITE_URL: ${VITE_PUBLIC_SITE_URL:-http://localhost:5173}
      VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-}
    command: pnpm dev --host 0.0.0.0
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend

volumes:
  frontend_node_modules:
  gpx_data:
  postgres_data:
  redis_data:
