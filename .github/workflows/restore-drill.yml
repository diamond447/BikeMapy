name: Non-production restore drill

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * 0"

permissions:
  contents: read

jobs:
  restore-drill:
    name: Restore a disposable PostGIS snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build a representative non-production snapshot
        env:
          BACKUP_ID: "20260101T030000Z"
        run: |
          set -Eeuo pipefail
          mkdir -p backup gpx-drill/media/gpx/routes
          docker run -d --name bikemapy-drill-source \
            -e POSTGRES_DB=bikemapy -e POSTGRES_USER=bikemapy -e POSTGRES_PASSWORD=drill-only \
            postgis/postgis:17-3.5 >/dev/null
          trap 'docker rm -f bikemapy-drill-source >/dev/null 2>&1 || true' EXIT
          database_ready=0
          for attempt in {1..60}; do
            if docker exec bikemapy-drill-source psql -h 127.0.0.1 -U bikemapy -d bikemapy \
              -c 'SELECT 1' >/dev/null 2>&1; then
              database_ready=1
              break
            fi
            sleep 2
          done
          if [ "$database_ready" -ne 1 ]; then
            echo "Source PostGIS database did not become queryable over TCP" >&2
            docker logs bikemapy-drill-source >&2 || true
            exit 1
          fi
          docker exec bikemapy-drill-source psql -U bikemapy -d bikemapy -v ON_ERROR_STOP=1 \
            -c 'CREATE TABLE catalogue_route (id bigint PRIMARY KEY); INSERT INTO catalogue_route VALUES (1), (2);'
          docker exec bikemapy-drill-source pg_dump -U bikemapy -Fc bikemapy > "backup/db-${BACKUP_ID}.dump"
          # Keep the fixture relative to the production volume root.  The
          # media/ prefix is required for Django storage references to resolve.
          printf 'sample gpx payload\n' > gpx-drill/media/gpx/routes/sample.gpx
          tar czf "backup/gpx-${BACKUP_ID}.tar.gz" -C gpx-drill .
          BACKUP_DIR=backup BACKUP_ID="$BACKUP_ID" bash deploy/write-backup-manifest.sh
      - name: Execute restore drill and produce evidence
        run: |
          set -Eeuo pipefail
          {
            date -u +%Y-%m-%dT%H:%M:%SZ
            echo "BACKUP_DIR=backup POSTGRES_USER=bikemapy ./deploy/restore-drill.sh 20260101T030000Z"
            BACKUP_DIR=backup POSTGRES_USER=bikemapy ./deploy/restore-drill.sh 20260101T030000Z
            date -u +%Y-%m-%dT%H:%M:%SZ
          } | tee backup/restore-drill-command.log
      - name: Upload restore evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: restore-drill-evidence
          path: |
            backup/manifest-*.json
            backup/restore-drill-*.json
            backup/restore-drill-command.log
          if-no-files-found: error
