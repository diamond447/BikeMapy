name: Quality checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A new push to a pull request cancels its superseded run; runs on main
  # always finish, so every merged commit has a complete result.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.areas.outputs.backend }}
      frontend: ${{ steps.areas.outputs.frontend }}
      e2e: ${{ steps.areas.outputs.e2e }}
      api_contract: ${{ steps.areas.outputs.api_contract }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: areas
        # Pull requests skip the jobs their changes cannot affect; a skipped
        # job reports success to required checks. Pushes run everything.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci_changed_areas.py --base "$BASE_SHA" --head "$HEAD_SHA"

  api-contract:
    name: API contract and generated client
    needs: changes
    if: needs.changes.outputs.api_contract == 'true'
    runs-on: ubuntu-latest
    env:
      DJANGO_DATABASE_ENGINE: django.db.backends.sqlite3
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: '3.13' }
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: { version: '0.9.26', enable-cache: true }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { version: 10.10.0 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: uv sync --locked --extra dev
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: uv run --locked --extra dev python scripts/check_openapi_sync.py

  backend:
    name: Backend (lint, types, SQLite-only tests)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    env:
      DJANGO_DATABASE_ENGINE: django.db.backends.sqlite3
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: '3.13' }
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: { version: '0.9.26', enable-cache: true }
      - run: uv sync --locked --extra dev
      - run: uv run --locked --extra dev ruff check backend
      - run: uv run --locked --extra dev ruff format --check backend scripts
      - run: uv run --locked --extra dev mypy backend
      # The complete suite runs once, on PostGIS, in the integration job.
      # Only the tests that exercise the SQLite fallbacks run here.
      - run: uv run --locked --extra dev pytest -m sqlite --no-cov

  integration:
    name: Infrastructure (PostGIS and Celery/Redis)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: bikemapy
          POSTGRES_USER: bikemapy
          POSTGRES_PASSWORD: bikemapy
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U bikemapy -d bikemapy"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_DB: bikemapy
      POSTGRES_USER: bikemapy
      POSTGRES_PASSWORD: bikemapy
      DJANGO_DATABASE_ENGINE: django.contrib.gis.db.backends.postgis
      DJANGO_CACHE_URL: redis://localhost:6379/1
      RUN_REDIS_TEST: "1"
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/0
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: '3.13' }
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends -y gdal-bin libgdal-dev libgeos-dev
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: { version: '0.9.26', enable-cache: true }
      - run: uv sync --locked --extra dev
      - run: uv run --locked --extra dev python backend/manage.py migrate --noinput
      # RUN_REDIS_TEST=1 and DJANGO_CACHE_URL above make the marked Redis
      # limiter test run as part of this complete PostGIS test suite.
      - name: Run PostGIS backend and Redis tests
        run: uv run --locked --extra dev pytest
      - name: Start Celery worker
        run: |
          uv run --locked --extra dev celery -A config worker --loglevel=WARNING --pool=solo > /tmp/celery-worker.log 2>&1 &
          echo $! > /tmp/celery-worker.pid
      - name: Verify PostGIS and Celery through Redis
        run: uv run --locked --extra dev python scripts/check_integrations.py
      - name: Show worker log on failure
        if: failure()
        run: cat /tmp/celery-worker.log
      - name: Stop Celery worker
        if: always()
        run: kill "$(cat /tmp/celery-worker.pid)" || true

  production-compose:
    name: Production Compose smoke
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: '3.13' }
      - name: Run disposable production Compose smoke
        run: python scripts/production_compose_smoke.py --daemon-restart

  production-static-assets:
    name: Production static-assets Compose smoke
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: '3.13' }
      - name: Verify Admin CSS and JS through Nginx
        run: python scripts/check_production_static_assets.py

  frontend:
    name: Frontend (lint, types, tests, build)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: frontend }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { version: 10.10.0 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format
      - run: pnpm exec tsc -b --pretty false
      - run: pnpm test
      - run: pnpm build
        env:
          VITE_PUBLIC_SITE_URL: http://localhost:5173
          VITE_API_URL: https://api.example.invalid
          VITE_ENABLE_REPORTS: "false"
      - name: Scan browser bundle for server credentials
        run: python ../scripts/check_frontend_bundle.py dist --read-only --forbidden-value "bikemapy-build-secret-canary"
      - name: Verify preview bundle is read-only
        run: test -z "$(rg -o '/reports/' dist || true)"
      - name: Cache Playwright browsers
        if: needs.changes.outputs.e2e == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
      - name: Install Playwright Chromium
        if: needs.changes.outputs.e2e == 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Run browser interaction and evidence tests
        if: needs.changes.outputs.e2e == 'true'
        run: pnpm exec playwright test
      - name: Run production preview MapLibre smoke test
        if: needs.changes.outputs.e2e == 'true'
        run: pnpm exec playwright test --config playwright.preview.config.ts
      - name: Upload Playwright reports
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-reports
          path: |
            frontend/playwright-report
            frontend/playwright-report-preview
          if-no-files-found: ignore
      - name: Upload issue 10 screenshots
        if: always() && needs.changes.outputs.e2e == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: issue-10-screenshots
          path: frontend/test-results/issue-10-screenshots
          if-no-files-found: warn
