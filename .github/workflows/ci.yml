name: Quality checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api-contract:
    name: API contract and generated client
    runs-on: ubuntu-latest
    env:
      DJANGO_DATABASE_ENGINE: django.db.backends.sqlite3
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.13' }
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with: { version: '0.9.26', enable-cache: true }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { version: 10.10.0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: uv sync --locked --extra dev
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: uv run --locked --extra dev python scripts/check_openapi_sync.py

  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: bikemapy
          POSTGRES_USER: bikemapy
          POSTGRES_PASSWORD: bikemapy
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U bikemapy -d bikemapy"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: [6379:6379]
    env:
      POSTGRES_HOST: localhost
      POSTGRES_DB: bikemapy
      POSTGRES_USER: bikemapy
      POSTGRES_PASSWORD: bikemapy
      DJANGO_DATABASE_ENGINE: django.db.backends.sqlite3
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/0
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.13' }
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with: { version: '0.9.26', enable-cache: true }
      - run: uv sync --locked --extra dev
      - run: uv run --locked --extra dev ruff check backend
      - run: uv run --locked --extra dev ruff format --check backend scripts
      - run: uv run --locked --extra dev mypy backend
      - run: uv run --locked --extra dev pytest

  integration:
    name: Infrastructure (PostGIS and Celery/Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: bikemapy
          POSTGRES_USER: bikemapy
          POSTGRES_PASSWORD: bikemapy
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U bikemapy -d bikemapy"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_DB: bikemapy
      POSTGRES_USER: bikemapy
      POSTGRES_PASSWORD: bikemapy
      DJANGO_DATABASE_ENGINE: django.contrib.gis.db.backends.postgis
      DJANGO_CACHE_URL: redis://localhost:6379/1
      RUN_REDIS_TEST: "1"
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/0
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.13' }
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends -y gdal-bin libgdal-dev libgeos-dev
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with: { version: '0.9.26', enable-cache: true }
      - run: uv sync --locked --extra dev
      - run: uv run --locked --extra dev python backend/manage.py migrate --noinput
      # RUN_REDIS_TEST=1 and DJANGO_CACHE_URL above make the marked Redis
      # limiter test run as part of this complete PostGIS test suite.
      - name: Run PostGIS backend and Redis tests
        run: uv run --locked --extra dev pytest
      - name: Start Celery worker
        run: |
          uv run --locked --extra dev celery -A config worker --loglevel=WARNING --pool=solo > /tmp/celery-worker.log 2>&1 &
          echo $! > /tmp/celery-worker.pid
      - name: Verify PostGIS and Celery through Redis
        run: uv run --locked --extra dev python scripts/check_integrations.py
      - name: Show worker log on failure
        if: failure()
        run: cat /tmp/celery-worker.log
      - name: Stop Celery worker
        if: always()
        run: kill "$(cat /tmp/celery-worker.pid)" || true

  production-compose:
    name: Production Compose smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.13' }
      - name: Run disposable production Compose smoke
        run: python scripts/production_compose_smoke.py --daemon-restart

  production-static-assets:
    name: Production static-assets Compose smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.13' }
      - name: Verify Admin CSS and JS through Nginx
        run: python scripts/check_production_static_assets.py

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: frontend }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { version: 10.10.0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format
      - run: pnpm exec tsc -b --pretty false
      - run: pnpm test
      - run: pnpm build
        env:
          VITE_PUBLIC_SITE_URL: http://localhost:5173
          VITE_API_URL: https://api.example.invalid
          VITE_ENABLE_REPORTS: "false"
      - name: Scan browser bundle for server credentials
        run: python ../scripts/check_frontend_bundle.py dist --read-only --forbidden-value "bikemapy-build-secret-canary"
      - name: Verify preview bundle is read-only
        run: test -z "$(rg -o '/reports/' dist || true)"
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run browser interaction and evidence tests
        run: pnpm exec playwright test
      - name: Run production preview MapLibre smoke test
        run: pnpm exec playwright test --config playwright.preview.config.ts
      - name: Upload issue 10 screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue-10-screenshots
          path: frontend/test-results/issue-10-screenshots
          if-no-files-found: warn

  security:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
