name: Backend image

on:
  pull_request:
    paths:
      - "backend/**"
      - "docker/backend.Dockerfile"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/backend-image.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "docker/backend.Dockerfile"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/backend-image.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-image-${{ github.sha }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/bikemapy-backend

jobs:
  backend-checks:
    name: Verify backend before packaging
    runs-on: ubuntu-latest
    env:
      DJANGO_DATABASE_ENGINE: django.db.backends.sqlite3
      PYTHONPATH: backend
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.9.26"
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: uv run --locked --extra dev ruff check backend
      - run: uv run --locked --extra dev ruff format --check backend scripts
      - run: uv run --locked --extra dev mypy backend
      - run: uv run --locked --extra dev pytest

  build:
    name: Build backend image
    needs: backend-checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The token can publish only in the trusted-event condition below. Pull
      # requests from forks receive a read-only token from GitHub regardless of
      # this declaration.
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@18ce135bb5112fa8ce4ed6c17ab05699d7f3a5e0 # v3.11.0

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to overwrite an existing commit tag
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          if docker buildx imagetools inspect "${IMAGE_NAME}:sha-${GITHUB_SHA}" >/dev/null 2>&1; then
            echo "An image already exists for ${GITHUB_SHA}; deploy its recorded digest instead of overwriting it."
            exit 1
          fi

      - name: Build and publish immutable image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/backend.Dockerfile
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          tags: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Write image provenance
        run: |
          mkdir -p image-provenance
          cat > image-provenance/manifest.json <<'EOF'
          {
            "repository": "${{ github.repository }}",
            "commit": "${{ github.sha }}",
            "image": "${{ env.IMAGE_NAME }}:sha-${{ github.sha }}",
            "digest": "${{ steps.image.outputs.digest }}"
          }
          EOF

      - name: Upload image provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-image-${{ github.sha }}
          path: image-provenance/manifest.json
          retention-days: 90
