name: Backend image

on:
  pull_request:
    paths:
      - "backend/**"
      - "scripts/**"
      - "docker/backend.Dockerfile"
      - ".dockerignore"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/backend-image.yml"
  # Publish only after CI has passed for a push to main.
  workflow_run:
    workflows: ["Quality checks"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-image-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/bikemapy-backend
  # workflow_run executes in the default-branch context, so the commit to
  # package is the one the quality run checked, not github.sha.
  SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  PUBLISH: ${{ github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch' }}

jobs:
  build:
    name: Build backend image
    # A pull request from a fork can be named main; only a passing push run of
    # this repository may publish.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to overwrite an existing commit tag
        if: env.PUBLISH == 'true'
        run: |
          if docker buildx imagetools inspect "${IMAGE_NAME}:sha-${SOURCE_SHA}" >/dev/null 2>&1; then
            echo "An image already exists for ${SOURCE_SHA}; deploy its recorded digest instead of overwriting it."
            exit 1
          fi

      - name: Build and publish immutable image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/backend.Dockerfile
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ env.IMAGE_NAME }}:sha-${{ env.SOURCE_SHA }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
            org.opencontainers.image.created=${{ github.event.workflow_run.head_commit.timestamp || github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Write image provenance
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          mkdir -p image-provenance
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg commit "$SOURCE_SHA" \
            --arg image "${IMAGE_NAME}:sha-${SOURCE_SHA}" \
            --arg digest "$IMAGE_DIGEST" \
            '{repository: $repository, commit: $commit, image: $image, digest: $digest}' \
            > image-provenance/manifest.json

      - name: Upload image provenance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-image-${{ env.SOURCE_SHA }}
          path: image-provenance/manifest.json
          retention-days: 90
