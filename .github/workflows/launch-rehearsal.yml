name: Disposable launch rehearsals

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launch-rehearsal:
    name: Deployment rollback and crawler resume
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Run disposable launch rehearsals
        run: python scripts/rehearse_launch.py --mode all --previous-ref HEAD^ --evidence-dir launch-evidence
      - name: Upload disposable rehearsal evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: issue-18-launch-rehearsal-evidence
          path: launch-evidence/*.json
          if-no-files-found: error
