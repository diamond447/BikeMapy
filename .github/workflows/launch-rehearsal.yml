name: Disposable launch rehearsals

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launch-rehearsal:
    name: Deployment rollback and crawler resume
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Run disposable launch rehearsals
        run: python scripts/rehearse_launch.py --mode all --previous-ref HEAD^ --evidence-dir launch-evidence
      - name: Upload disposable rehearsal evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue-18-launch-rehearsal-evidence
          path: launch-evidence/*.json
          if-no-files-found: error
