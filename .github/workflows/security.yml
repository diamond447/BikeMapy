name: Security assurance

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"
          post-processed-sarif-path: /tmp/codeql-results
          # The local gate below is authoritative; repository code scanning is
          # intentionally not required for this project.
          upload: never
          upload-database: false
      - name: Fail on actionable CodeQL findings
        run: python scripts/check_codeql_sarif.py /tmp/codeql-results

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scan repository history
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  python-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.9.26"
          enable-cache: true
      - name: Export locked runtime dependencies
        run: uv export --locked --no-dev --no-emit-project --format requirements.txt > /tmp/bikemapy-requirements.txt
      - name: Check the documented audit exceptions
        run: python scripts/check_audit_exceptions.py validate
      - name: Audit locked runtime dependencies
        run: |
          read -r -a ignores <<< "$(python scripts/check_audit_exceptions.py pip-audit-args)"
          uv tool run --from "pip-audit==2.9.0" pip-audit --strict "${ignores[@]}" \
            -r /tmp/bikemapy-requirements.txt

  frontend-audit:
    name: Frontend dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.10.0
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install locked dependencies without lifecycle scripts
        working-directory: frontend
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Audit locked dependencies
        working-directory: frontend
        # pnpm exits non-zero on any finding; the script decides.
        run: |
          pnpm audit --json > /tmp/pnpm-audit.json || true
          python ../scripts/check_audit_exceptions.py pnpm < /tmp/pnpm-audit.json

  report-scheduled-result:
    name: Track the scheduled result in an issue
    if: always() && github.event_name == 'schedule'
    needs: [codeql, gitleaks, python-audit, frontend-audit]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      RESULTS: >-
        codeql=${{ needs.codeql.result }}
        gitleaks=${{ needs.gitleaks.result }}
        python-audit=${{ needs.python-audit.result }}
        frontend-audit=${{ needs.frontend-audit.result }}
    steps:
      - name: Open, update or close the tracking issue
        run: |
          set -euo pipefail
          title="Scheduled security assurance is failing"
          label="security-assurance"
          gh label create "$label" --color B60205 \
            --description "Scheduled security assurance run" --force >/dev/null
          number="$(gh issue list --state open --label "$label" --search "in:title \"$title\"" \
            --json number --jq '.[0].number // empty')"
          failed=""
          for result in $RESULTS; do
            case "$result" in *=success|*=skipped) ;; *) failed="$failed $result" ;; esac
          done
          if [ -n "$failed" ]; then
            body="The scheduled run failed:${failed}. Run: ${RUN_URL}

          Fix the finding, or record an exception with a reason and an expiry date in .github/audit-exceptions.json."
            if [ -n "$number" ]; then
              gh issue comment "$number" --body "$body"
            else
              gh issue create --title "$title" --label "$label" --body "$body"
            fi
          elif [ -n "$number" ]; then
            gh issue close "$number" --comment "The scheduled run passed again: ${RUN_URL}"
          fi
